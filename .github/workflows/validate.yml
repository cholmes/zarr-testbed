name: Validate catalog

# Every catalog.json is generated from the directory tree, so a hand edit that
# was not rebuilt would publish a broken link graph. The catalog is served
# straight from raw.githubusercontent.com, so there is nothing to deploy and
# this is the only gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: node scripts/build-catalogs.mjs --check
